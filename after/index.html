<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>アフター生 出欠</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --aqua:#17b6ac; --aqua-deep:#0b6f6a; --aqua-ink:#0a4a48;
    --aqua-soft:#d6f2ef; --aqua-mist:#eefaf8; --bg:#f3fbfa; --card:#fff; --line:#d5e8e6;
    --present:#17a06a; --present-bg:#e2f5ec; --absent:#d6685f; --absent-bg:#fbe9e7;
    --muted:#7a938f; --shadow:0 6px 24px rgba(11,111,106,.10);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--aqua-ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}
  header.app{display:flex;align-items:center;gap:12px;padding:18px 20px;background:linear-gradient(135deg,var(--aqua),var(--aqua-deep));color:#fff;border-radius:18px;box-shadow:var(--shadow)}
  header.app .mark{width:40px;height:40px;border-radius:12px;flex:none;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:20px}
  header.app h1{font-weight:800;font-size:20px;margin:0;letter-spacing:.02em}
  header.app p{margin:0;font-size:12.5px;opacity:.9}
  .tabs{display:flex;gap:8px;margin:18px 0}
  .tab{flex:1;padding:11px 8px;cursor:pointer;font-weight:700;font-size:15px;background:#fff;color:var(--aqua-deep);border:1.5px solid var(--line);border-radius:12px}
  .tab[aria-selected="true"]{background:var(--aqua-deep);color:#fff;border-color:var(--aqua-deep);box-shadow:var(--shadow)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h2{font-weight:800;font-size:16px;margin:0 0 4px;color:var(--aqua-deep);display:flex;align-items:center;gap:8px}
  .card h2 .n{width:22px;height:22px;border-radius:7px;font-size:12px;background:var(--aqua-soft);color:var(--aqua-deep);display:grid;place-items:center;flex:none}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  input,select{width:100%;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--aqua-ink);border:1.5px solid var(--line);border-radius:10px;background:#fff}
  input:focus,select:focus{outline:2px solid var(--aqua);border-color:var(--aqua)}
  .row{display:flex;gap:8px} .row>*{min-width:0} .grow{flex:1}
  button.btn{font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer;border:none;background:var(--aqua);color:#fff}
  button.btn:hover{background:var(--aqua-deep)}
  button.btn.ghost{background:#fff;color:var(--aqua-deep);border:1.5px solid var(--line)} button.btn.ghost:hover{background:var(--aqua-mist)}
  button.btn.sm{padding:6px 10px;font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--aqua-mist);border:1px solid var(--aqua-soft);border-radius:999px;padding:5px 6px 5px 13px;font-size:13.5px;font-weight:500}
  .chip button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 4px} .chip button:hover{color:var(--absent)}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .tablewrap{overflow-x:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{background:var(--aqua-mist);color:var(--aqua-deep);font-weight:700;font-size:13px}
  tbody th{text-align:left;font-weight:700;color:var(--aqua-ink);background:#fbfefe;position:sticky;left:0}
  td .o{color:var(--present);font-weight:800;font-size:18px} td .x{color:var(--absent);font-weight:800;font-size:18px} td .dash{color:#c7d8d5}
  tbody tr:last-child th,tbody tr:last-child td{border-bottom:none}
  .lecrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px}
  .lecrow.done{background:var(--aqua-mist);border-color:var(--aqua-soft)}
  .lecrow .date{font-weight:700} .lecrow .lbl{color:var(--muted);font-size:12.5px}
  .pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
  .pick button.on-o{background:var(--present-bg);border-color:var(--present);color:var(--present)}
  .pick button.on-x{background:var(--absent-bg);border-color:var(--absent);color:var(--absent)}
  .pick button:disabled{cursor:default} .pick button.off:disabled{opacity:.4}
  .pick button.chg{padding:6px 12px;border-style:dashed;color:var(--aqua-deep);border-color:var(--aqua)}
  .subrow{margin-top:14px;text-align:right}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--aqua-ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:10}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .stat{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat div{background:var(--aqua-mist);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--aqua-deep)}
  .stat div span{font-size:18px}
  .loading{text-align:center;color:var(--muted);padding:24px;font-size:14px}
  .danger{color:var(--absent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="mark">🎓</div>
    <div><h1>アフター生 出欠</h1><p>名簿は受講生カルテのアフター生（在籍状況）とリアルタイム連動</p></div>
  </header>
  <div class="tabs">
    <button class="tab" id="tabStudent" aria-selected="true" onclick="switchTab('student')">アフター生 出欠フォーム</button>
    <button class="tab" id="tabAdmin" aria-selected="false" onclick="switchTab('admin')">管理者 設定・集計</button>
  </div>
  <div id="view" class="loading">読み込み中…</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== Firebase（カルテと同じプロジェクト） ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDfZ2SFmj2arUWoOFvw0jyn_1_ben-pfO0",
  authDomain: "health-school-9d414.firebaseapp.com",
  projectId: "health-school-9d414",
  storageBucket: "health-school-9d414.firebasestorage.app",
  messagingSenderId: "1090225614999",
  appId: "1:1090225614999:web:2b087b4d5e0add606279d2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const KARTE  = db.collection('karte_app').doc('data');            // 生徒名簿の一元ソース（読み取りのみ）
const ROSTER = db.collection('after_lecture_app').doc('roster');  // { lectures:[{id,date,label}] }（このアプリのみ書込）
const CATT   = db.collection('after_att');                        // doc(生徒ID)={ marks:{ lectureId:'present'|'absent' } }

/* ===== state ===== */
let students = [];   // アフター生のみ（カルテのisAfter=true）
let lectures = [];
let attCache = {};   // { studentId: { lectureId:'present'|'absent' } }
let kLoaded=false, rLoaded=false, aLoaded=false;
let currentTab='student';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function fmtDate(d){if(!d)return'';const p=String(d).split('-');if(p.length<3)return String(d);const wd=['日','月','火','水','木','金','土'][new Date(p[0]+'-'+p[1]+'-'+p[2]+'T00:00:00').getDay()];return Number(p[1])+'月'+Number(p[2])+'日('+wd+')';}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function sortedLectures(){return[...lectures].sort((a,b)=>String(a.date).localeCompare(String(b.date)));}
function sortedStudents(){return[...students].sort((a,b)=>String(a.kana||a.name).localeCompare(String(b.kana||b.name),'ja'));}
function loadAtt(sid){return attCache[sid]||{};}

/* ===== Firestore 保存（このアプリの書込先のみ） ===== */
async function saveRoster(){ try{ await ROSTER.set({lectures:lectures},{merge:true}); }catch(e){ toast('保存に失敗しました'); throw e; } }
async function saveAtt(sid,marks){ await CATT.doc(sid).set({marks:marks},{merge:true}); }

/* ===== 購読 ===== */
KARTE.onSnapshot(s=>{
  let data=null; const d=s.exists?s.data():null;
  if(d){ if(typeof d.json==='string'){ try{ data=JSON.parse(d.json); }catch(e){ data=null; } } else { data=d; } }
  const all=(data&&data.students)||[];
  students=all.filter(x=>x&&x.isAfter).map(x=>({id:x.id,name:x.name||'',kana:x.kana||''}));
  kLoaded=true; onData();
},()=>{ showErr(); });
ROSTER.onSnapshot(s=>{ const d=s.exists?s.data():null; lectures=(d&&d.lectures)||[]; rLoaded=true; onData(); },()=>{});
CATT.onSnapshot(s=>{ attCache={}; s.forEach(doc=>{ attCache[doc.id]=(doc.data()&&doc.data().marks)||{}; }); aLoaded=true; onData(); },()=>{});

function showErr(){ document.getElementById('view').innerHTML='<div class="card"><p class="hint danger">データベースに接続できませんでした。少し待って再読み込みしてください。</p></div>'; }
function onData(){ if(!kLoaded||!rLoaded||!aLoaded) return; if(currentTab==='admin') renderAdmin(); else if(!stu.sid) renderStudent(); }
let adminUnlocked=false;
function switchTab(t){
  if(t==='admin' && !adminUnlocked){
    const pw=prompt('管理者パスワードを入力してください');
    if(pw===null) return;
    if(pw!=='1111'){ toast('パスワードが違います'); return; }
    adminUnlocked=true;
  }
  currentTab=t;
  document.getElementById('tabStudent').setAttribute('aria-selected',t==='student');
  document.getElementById('tabAdmin').setAttribute('aria-selected',t==='admin');
  render();
}
function render(){ currentTab==='admin'?renderAdmin():renderStudent(); }

/* ================= アフター生ビュー ================= */
let stu={sid:null, saved:{}, draft:{}, editing:new Set()};
function renderStudent(){
  const view=document.getElementById('view');
  if(!students.length){ view.innerHTML='<div class="card"><h2><span class="n">!</span>アフター生が未登録です</h2><p class="hint">受講生カルテでアフター生にチェックを入れると、ここに表示されます。</p></div>'; return; }
  if(!lectures.length){ view.innerHTML='<div class="card"><h2><span class="n">!</span>準備中です</h2><p class="hint">管理者がアフターの開催日を登録すると、出欠を送信できます。</p></div>'; return; }
  const opts=sortedStudents().map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');
  view.innerHTML='<div class="card"><h2><span class="n">1</span>お名前を選択</h2>'+
    '<p class="hint">ご自身の名前を選ぶと、開催日ごとの出欠を送信できます。</p>'+
    '<select id="stuSel" onchange="onStudentPick()"><option value="">— 選択してください —</option>'+opts+'</select></div>'+
    '<div id="stuForm"></div>';
  if(stu.sid && students.some(s=>s.id===stu.sid)){ document.getElementById('stuSel').value=stu.sid; renderStuForm(); }
}
function onStudentPick(){
  const sid=document.getElementById('stuSel').value; const box=document.getElementById('stuForm');
  if(!sid){ stu={sid:null,saved:{},draft:{},editing:new Set()}; box.innerHTML=''; return; }
  const saved=loadAtt(sid); const editing=new Set();
  sortedLectures().forEach(l=>{ if(saved[l.id]===undefined) editing.add(l.id); });
  stu={sid,saved:{...saved},draft:{...saved},editing}; renderStuForm();
}
function renderStuForm(){
  const box=document.getElementById('stuForm');
  const rows=sortedLectures().map(l=>{
    const savedVal=stu.saved[l.id]; const isEditing=stu.editing.has(l.id);
    const done=savedVal!==undefined&&!isEditing; let right;
    if(isEditing){ const d=stu.draft[l.id];
      right='<div class="pick"><button class="'+(d==='present'?'on-o':'')+'" onclick="pick(\''+l.id+'\',\'present\')">○ 出席</button>'+
        '<button class="'+(d==='absent'?'on-x':'')+'" onclick="pick(\''+l.id+'\',\'absent\')">× 欠席</button></div>';
    }else{
      right='<div class="pick"><button class="'+(savedVal==='present'?'on-o':'off')+'" disabled>○ 出席</button>'+
        '<button class="'+(savedVal==='absent'?'on-x':'off')+'" disabled>× 欠席</button>'+
        '<button class="chg" onclick="changeRow(\''+l.id+'\')">変更</button></div>';
    }
    return '<div class="lecrow '+(done?'done':'')+'"><div class="grow"><div class="date">'+fmtDate(l.date)+'</div>'+(l.label?'<div class="lbl">'+esc(l.label)+'</div>':'')+'</div>'+right+'</div>';
  }).join('');
  const anyEditing=[...stu.editing].length>0;
  box.innerHTML='<div class="card"><h2><span class="n">2</span>出欠を選んで送信</h2>'+
    '<p class="hint">「出席／欠席」を選んで送信してください。送信済みは色付きで表示され、「変更」から修正できます。</p>'+rows+
    (anyEditing?'<div class="subrow"><button class="btn" onclick="submitAtt()">この内容で送信する</button></div>':'')+'</div>';
}
function pick(lid,val){ stu.draft[lid]=val; renderStuForm(); }
function changeRow(lid){ stu.editing.add(lid); if(stu.draft[lid]===undefined&&stu.saved[lid]!==undefined) stu.draft[lid]=stu.saved[lid]; renderStuForm(); }
async function submitAtt(){
  const next={...stu.saved}; let n=0;
  stu.editing.forEach(lid=>{ if(stu.draft[lid]!==undefined){ next[lid]=stu.draft[lid]; n++; } });
  if(n===0){ toast('出席／欠席を選んでください'); return; }
  try{ await saveAtt(stu.sid,next); stu.saved=next; stu.draft={...next}; stu.editing=new Set(); renderStuForm();
    const name=(students.find(s=>s.id===stu.sid)||{}).name||''; toast(name+' さんの出欠を送信しました');
  }catch(e){ toast('送信に失敗しました。もう一度お試しください'); }
}

/* ================= 管理者ビュー ================= */
function renderAdmin(){
  const view=document.getElementById('view');
  const lecChips=lectures.length
    ? '<div class="chips">'+sortedLectures().map(l=>'<span class="chip">'+fmtDate(l.date)+(l.label?' ・ '+esc(l.label):'')+'<button title="削除" onclick="delLecture(\''+l.id+'\')">×</button></span>').join('')+'</div>'
    : '<div class="empty">まだ開催日が登録されていません。</div>';
  view.innerHTML=
    '<div class="card"><h2><span class="n">1</span>出欠状況一覧</h2>'+
      '<p class="hint">○＝出席／×＝欠席／−＝未送信。カルテのアフター生（在籍中）を自動表示します。</p>'+
      '<div style="margin-bottom:10px"><button class="btn ghost sm" onclick="exportCsv()">CSVで書き出す</button></div>'+
      '<div id="grid" class="loading">集計中…</div></div>'+
    '<div class="card"><h2><span class="n">2</span>開催日（アフター）</h2>'+
      '<p class="hint">日付と、任意でテーマを登録します。</p>'+
      '<div class="row"><input type="date" id="lecDate" style="flex:0 0 170px"><input type="text" id="lecLabel" placeholder="テーマ（任意）" class="grow"><button class="btn sm" onclick="addLecture()">追加</button></div>'+
      lecChips+'</div>'+
    '<div class="card"><h2><span class="n">⚙</span>データ管理</h2>'+
      '<p class="hint">アフター生の名簿はカルテ側で管理します（ここでは変更できません）。下はアフター出欠の記録のみ消去します。</p>'+
      '<button class="btn ghost sm danger" onclick="resetAtt()">アフター出欠データを消去</button></div>';
  buildGrid();
}
async function addLecture(){
  const d=document.getElementById('lecDate').value; const lbl=document.getElementById('lecLabel').value.trim();
  if(!d){ toast('日付を選んでください'); return; }
  lectures=[...lectures,{id:uid(),date:d,label:lbl}];
  try{ await saveRoster(); toast('開催日を追加しました'); }catch(e){}
}
async function delLecture(id){ lectures=lectures.filter(l=>l.id!==id); try{ await saveRoster(); }catch(e){} }

function buildGrid(){
  const el=document.getElementById('grid'); if(!el) return;
  const studs=sortedStudents();
  if(!studs.length){ el.innerHTML='<div class="empty">カルテでアフター生にチェックを入れると、ここに表示されます。</div>'; return; }
  const lecs=sortedLectures();
  if(!lecs.length){
    const rows=studs.map(s=>'<tr><th>'+esc(s.name)+'</th></tr>').join('');
    el.innerHTML='<div class="tablewrap"><table><thead><tr><th>アフター生</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="empty" style="margin-top:8px">開催日を登録すると出欠列が追加されます。</div>'; return;
  }
  const head='<tr><th>アフター生 ＼ 開催日</th>'+lecs.map(l=>'<th>'+fmtDate(l.date)+(l.label?'<br><span style="font-weight:400;font-size:11px">'+esc(l.label)+'</span>':'')+'</th>').join('')+'</tr>';
  const body=studs.map(s=>{ const a=loadAtt(s.id);
    const cells=lecs.map(l=>{ const v=a[l.id]; if(v==='present')return'<td><span class="o">○</span></td>'; if(v==='absent')return'<td><span class="x">×</span></td>'; return'<td><span class="dash">−</span></td>'; }).join('');
    return '<tr><th>'+esc(s.name)+'</th>'+cells+'</tr>';
  }).join('');
  let present=0,absent=0; const total=studs.length*lecs.length;
  studs.forEach(s=>{ const a=loadAtt(s.id); lecs.forEach(l=>{ if(a[l.id]==='present')present++; else if(a[l.id]==='absent')absent++; }); });
  el.innerHTML='<div class="tablewrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="stat"><div>出席 <span>'+present+'</span></div><div>欠席 <span>'+absent+'</span></div><div>未送信 <span>'+(total-present-absent)+'</span></div></div>';
}
function exportCsv(){
  const studs=sortedStudents(); const lecs=sortedLectures();
  if(!studs.length){ toast('アフター生がいません'); return; }
  const header=['名前'].concat(lecs.map(l=>fmtDate(l.date)+(l.label?' '+l.label:'')));
  const rows=[header];
  studs.forEach(s=>{ const a=loadAtt(s.id); rows.push([s.name].concat(lecs.map(l=>a[l.id]==='present'?'○':a[l.id]==='absent'?'×':''))); });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='アフター生出欠.csv'; a.click(); URL.revokeObjectURL(a.href);
}
async function resetAtt(){
  if(!confirm('アフター出欠の記録をすべて消去します。よろしいですか？（名簿・カルテには影響しません）'))return;
  try{ const snap=await CATT.get(); const batch=db.batch(); snap.forEach(d=>batch.delete(d.ref)); await batch.commit();
    lectures=[]; await ROSTER.set({lectures:[]},{merge:true}); toast('消去しました');
  }catch(e){ toast('消去に失敗しました'); }
}
</script>
</body>
</html>
